spring.application.name=admosa-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/admosa_db
spring.datasource.username=${ADMOSA_DB_USER:postgres}
spring.datasource.password=${ADMOSA_DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
