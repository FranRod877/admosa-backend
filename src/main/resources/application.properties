spring.application.name=admosa-backend

# Archivo opcional fuera del repo con overrides locales (credenciales reales de
# cada quien). Si no existe, no pasa nada: se usan los valores por defecto de abajo.
spring.config.import=optional:file:${user.home}/.admosa-backend.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/admosa_db
spring.datasource.username=${ADMOSA_DB_USER:postgres}
spring.datasource.password=${ADMOSA_DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

admosa.jwt.secret=${ADMOSA_JWT_SECRET:change-this-dev-only-secret-please-0123456789abcdef}
admosa.jwt.expiration-minutes=${ADMOSA_JWT_EXPIRATION_MINUTES:120}
admosa.storage.location=${ADMOSA_STORAGE_LOCATION:storage/uploads}
admosa.cors.allowed-origin=${ADMOSA_CORS_ORIGIN:http://localhost:5173}
